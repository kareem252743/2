<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@# ! Whisky | Profile</title>
    
    <!-- استيراد الخطوط -->
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #ffffff;
            --bg-color: #080808;
            --container-bg: rgba(27, 27, 27, 0.6);
            --accent-glow: 0px 0px 15px rgba(255, 255, 255, 0.3);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Onest', sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        /* خلفية الفيديو أو الصورة */
        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('https://r2.guns.lol/b27d6e35-52f3-4a8e-b13e-9b0701e3a1d8.jpg'); /* صورة احتياطية */
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        /* الحاوية الرئيسية */
        .profile-container {
            background: var(--container-bg);
            backdrop-filter: blur(10px);
            padding: 40px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 90%;
            max-width: 450px;
            box-shadow: var(--accent-glow);
            animation: fadeIn 1.5s ease-in-out;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid var(--primary-color);
            margin-bottom: 20px;
            object-fit: cover;
        }

        h1 {
            font-size: 28px;
            margin: 10px 0;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .bio {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
        }

        /* الروابط */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .social-icon {
            color: var(--primary-color);
            font-size: 24px;
            text-decoration: none;
            transition: transform 0.3s, filter 0.3s;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.5));
        }

        .social-icon:hover {
            transform: translateY(-5px);
            filter: drop-shadow(0 0 10px rgba(255,255,255,1));
        }

        /* تأثير تساقط الثلج المبسط */
        .snowflake {
            position: fixed;
            top: -10px;
            color: white;
            user-select: none;
            z-index: 1000;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(105vh); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="background-overlay"></div>

    <div class="profile-container">
        <!-- الصورة الشخصية -->
        <img src="https://r2.guns.lol/b27d6e35-52f3-4a8e-b13e-9b0701e3a1d8.jpg" alt="Whisky" class="avatar">
        
        <!-- الاسم والبيو -->
        <h1># ! Whisky</h1>
        <p class="bio">None like me , I'm the ONE !!</p>

        <!-- الروابط الاجتماعية (أيقونات بسيطة) -->
        <div class="social-links">
            <a href="https://open.spotify.com/user/313y77cc5pqrodgqgjlgn7zwis2i" target="_blank" class="social-icon">🎧</a>
            <a href="https://tiktok.com/@whisky_h4x" target="_blank" class="social-icon">📱</a>
            <a href="https://youtube.com/@whisky_h4xx" target="_blank" class="social-icon">🎬</a>
            <a href="https://instagram.com/whisky_h4x/" target="_blank" class="social-icon">📸</a>
            <a href="https://t.me/whisky_h4x" target="_blank" class="social-icon">✈️</a>
        </div>
    </div>

    <!-- سكربت تساقط الثلج -->
    <script>
        function createSnowflake() {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            snowflake.innerHTML = '❄';
            snowflake.style.left = Math.random() * 100 + 'vw';
            snowflake.style.animationDuration = Math.random() * 3 + 2 + 's';
            snowflake.style.opacity = Math.random();
            snowflake.style.fontSize = Math.random() * 10 + 10 + 'px';
            
            document.body.appendChild(snowflake);
            
            setTimeout(() => {
                snowflake.remove();
            }, 5000);
        }

        setInterval(createSnowflake, 100);
    </script>

</body>
</html>
