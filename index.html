<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0"/>
    <title>KARIM | Premium Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Cinzel:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold-bright: #fff5e1;
            --gold-main: #f5d08b;
            --gold-dark: #b8860b;
            --bg-black: #050403;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo', sans-serif; }

        body {
            background: var(--bg-black);
            color: white;
            overflow-x: hidden;
            user-select: none;
        }

        /* --- Ultra Sharp Chrome Shine --- */
        .shine-text {
            background: linear-gradient(to right, 
                var(--gold-dark) 0%, 
                var(--gold-main) 15%, 
                #fff 25%, 
                #fff 30%,
                var(--gold-main) 45%, 
                var(--gold-dark) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: chromeShine 2.5s linear infinite;
            font-family: 'Cinzel', serif;
        }

        @keyframes chromeShine {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        /* --- Hero Section --- */
        .hero {
            width: 100%; min-height: 100vh; position: relative;
            background: radial-gradient(circle at center, #1a120a 0%, var(--bg-black) 100%);
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* UI Pyramid Design */
        .pyramid-container {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 300px; height: 300px;
            z-index: 2; display: flex; justify-content: center; align-items: center;
        }

        .ui-pyramid {
            position: relative;
            width: 0; height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-bottom: 260px solid var(--gold-dark);
            filter: drop-shadow(0 0 30px rgba(184, 134, 11, 0.4));
            animation: float 5s ease-in-out infinite;
        }

        .ui-pyramid::after {
            content: "𓂀";
            position: absolute; top: 120px; left: -25px;
            font-size: 50px; color: rgba(0,0,0,0.7);
            text-shadow: 0 1px 1px rgba(255,255,255,0.2);
        }

        .ui-pyramid::before {
            content: ""; position: absolute;
            top: 5px; left: -140px;
            border-left: 140px solid transparent;
            border-right: 140px solid transparent;
            border-bottom: 245px solid var(--gold-main);
            opacity: 0.9;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        /* --- Content --- */
        nav { padding: 40px; text-align: center; z-index: 10; }
        .logo { font-size: 28px; letter-spacing: 10px; font-weight: 900; }

        .content {
            flex: 1; display: flex; align-items: center; justify-content: space-between;
            padding: 0 10%; z-index: 5;
        }

        .text { width: 45%; }
        .text h1 { font-size: clamp(40px, 8vw, 80px); line-height: 0.9; margin: 10px 0; }
        .text p { color: #888; font-size: 16px; margin-bottom: 30px; border-left: 2px solid var(--gold-main); padding-left: 15px; }

        .btn-premium {
            padding: 15px 40px; background: none; border: 1px solid var(--gold-main);
            color: var(--gold-main); font-weight: bold; letter-spacing: 3px;
            cursor: pointer; transition: 0.4s; text-transform: uppercase;
        }
        .btn-premium:hover { background: var(--gold-main); color: #000; box-shadow: 0 0 30px var(--gold-main); }

        /* --- Bottom UI Cards --- */
        .bottom {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 15px; padding: 40px 10%; z-index: 10;
        }

        .card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(245, 208, 139, 0.1);
            padding: 30px 15px; text-align: center;
            backdrop-filter: blur(10px); transition: 0.4s;
        }

        .card:hover { border-color: var(--gold-main); transform: translateY(-10px); }
        .card h2 { font-family: 'Cinzel'; color: var(--gold-main); font-size: 30px; }
        .card p { font-size: 10px; letter-spacing: 2px; color: #555; }

        /* --- Particles --- */
        .sand span {
            position: absolute; width: 2px; height: 2px; background: var(--gold-main);
            border-radius: 50%; opacity: 0.3; animation: sandFall linear infinite;
        }

        @keyframes sandFall { 
            0% { transform: translateY(-10vh); opacity: 0; } 
            100% { transform: translateY(110vh); opacity: 0; } 
        }

        /* --- Login Screen --- */
        #login {
            position:fixed; inset:0; background:#000; z-index:1000; 
            display:flex; flex-direction:column; justify-content:center; align-items:center; 
            transition:0.8s ease-in-out;
        }

        /* --- Responsive (iPhone/Mobile) --- */
        @media (max-width: 768px) {
            .content { flex-direction: column-reverse; text-align: center; padding-top: 60px; }
            .text { width: 100%; margin-top: 300px; }
            .pyramid-container { top: 30%; transform: translate(-50%, -50%) scale(0.7); }
            .bottom { grid-template-columns: repeat(2, 1fr); padding: 20px 5%; }
            .logo { font-size: 20px; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- Audio Element -->
    <audio id="bgMusic" loop>
        <source src="one.mp3" type="audio/mpeg">
    </audio>

    <!-- Login Screen -->
    <div id="login">
        <h2 class="shine-text" style="font-size:35px; margin-bottom:10px; letter-spacing:8px;">WELCOME</h2>
        <p style="color:#444; font-size:10px; letter-spacing:4px; margin-bottom:30px;">PRESS TO UNLOCK EXPERIENCE</p>
        <button onclick="enter()" class="btn-premium">ENTER NOW</button>
    </div>

    <section class="hero">
        <div class="sand" id="sand"></div>
        
        <nav>
            <div class="logo shine-text">KARIM ELSAYED</div>
        </nav>

        <div class="pyramid-container">
            <div class="ui-pyramid"></div>
        </div>

        <div class="content">
            <div class="text">
                <h1 class="shine-text">I AM <br> EGYPTIAN</h1>
                <p>Architecting digital monuments with high-performance code and premium UI aesthetics.</p>
                <button class="btn-premium" onclick="window.open('https://wa.me/201063566783')">GET IN TOUCH</button>
            </div>
            <div style="width: 30%; display: flex; justify-content: center;">
                <span style="font-size: clamp(100px, 15vw, 200px); color: rgba(245, 208, 139, 0.05);">☥</span>
            </div>
        </div>

        <div class="bottom">
            <div class="card"><h2>20</h2><p>AGE</p></div>
            <div class="card"><h2>SGU</h2><p>UNIVERSITY</p></div>
            <div class="card"><h2>EGY</h2><p>COUNTRY</p></div>
            <div class="card"><h2>PRO</h2><p>LEVEL</p></div>
        </div>
    </section>

    <script>
        const music = document.getElementById("bgMusic");

        function enter() {
            // تشغيل الملف الصوتي
            music.volume = 0.4;
            music.play().catch(e => console.log("Audio play blocked"));

            // إخفاء شاشة الدخول
            const login = document.getElementById('login');
            login.style.opacity = '0';
            setTimeout(() => login.style.display = 'none', 800);
        }

        // إنشاء الرمال بشكل عشوائي
        const sand = document.getElementById('sand');
        const particleCount = window.innerWidth < 768 ? 30 : 60;
        for (let i = 0; i < particleCount; i++) {
            const s = document.createElement('span');
            s.style.left = Math.random() * 100 + '%';
            s.style.animationDuration = (Math.random() * 3 + 3) + 's';
            s.style.animationDelay = (Math.random() * 5) + 's';
            sand.appendChild(s);
        }

        // حماية بسيطة للكود
        document.onkeydown = function(e) {
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0))) return false;
        };
    </script>
</body>
</html>
